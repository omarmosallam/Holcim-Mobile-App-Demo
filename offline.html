<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline — HOLCIM Management Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 28px 24px;
      border-radius: 16px;
      max-width: 380px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    h1 { font-size: 20px; color: #0b3b75; margin-bottom: 10px; }
    p { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 20px; }
    button {
      background: #0b3b75;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>You’re Currently Offline</h1>
    <p>For data security, live employee records from Google Sheets are not stored offline. Reconnect to the internet to load current records.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
